name: RabbitMole quality and Cloudflare release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and dry-run the production bundle
        run: npm run deploy:check
      - name: Shell syntax
        run: bash -n rabbitmole.sh collect-local.sh discovery/run.sh discovery/setup.sh
      - run: npx playwright install --with-deps chromium
      - name: PDF executive and technical acceptance
        timeout-minutes: 3
        env:
          PDF_ACCEPTANCE_DIR: artifacts/pdf
        run: node tests/test_report_browser.cjs
      - name: PWA browser, persistence and offline acceptance
        timeout-minutes: 3
        run: node tests/test_pwa_browser.cjs
      - name: Save A4 acceptance PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmole-report-pdfs-${{ github.sha }}
          path: artifacts/pdf/*.pdf
          if-no-files-found: ignore
      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmole-cloudflare-${{ github.sha }}
          path: dist-pages/
          include-hidden-files: true
