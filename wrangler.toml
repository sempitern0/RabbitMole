name = "rabbitmole"
main = "deploy/worker.js"
compatibility_date = "2026-10-15"
workers_dev = true

[assets]
directory = "./dist-pages"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# A plain wrangler deploy cannot accidentally publish a missing/stale bundle.
[build]
command = "python3 deploy/build-pages-demo.py"
