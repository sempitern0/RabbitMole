name: RabbitMole quality and Cloudflare release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and dry-run the production bundle
        run: npm run deploy:check
      - name: Shell syntax
        run: bash -n rabbitmole.sh collect-local.sh discovery/run.sh discovery/setup.sh
      - run: npx playwright install --with-deps chromium
      - name: PDF executive and technical acceptance
        timeout-minutes: 3
        env:
          PDF_ACCEPTANCE_DIR: artifacts/pdf
        run: node tests/test_report_browser.cjs
      - name: PWA browser, persistence and offline acceptance
        timeout-minutes: 3
        run: node tests/test_pwa_browser.cjs
      - name: Save A4 acceptance PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmole-report-pdfs-${{ github.sha }}
          path: artifacts/pdf/*.pdf
          if-no-files-found: ignore
      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmole-cloudflare-${{ github.sha }}
          path: dist-pages/
          include-hidden-files: true

  windows-collector:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell collectors
        shell: powershell
        run: |
          $files = @('collect-local.ps1', 'discovery/native.ps1', 'discovery/run.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw ("PowerShell parse failed: " + $file)
            }
          }
      - name: Smoke test Windows inventory in standard process
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\collect-local.ps1 -Output .\inventory-test.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows collector failed' }
          $capture = Get-Content -Raw -Encoding UTF8 .\inventory-test.json | ConvertFrom-Json
          if ($capture.kind -ne 'rabbitmole-discovery-v1') { throw 'Invalid capture kind' }
          if (-not $capture.source.deviceId) { throw 'Missing stable device identifier' }
          if (-not $capture.items.assets.Count) { throw 'Missing hardware inventory' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\collect-local.ps1 -Output .\inventory-test.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .\inventory-test-1.json)) { throw 'Repeat capture failed' }
